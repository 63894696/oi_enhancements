[package]
name = "securedm-shell"
version = "0.1.0"
description = "SecureDM 本地壳(原生桥)— 桌面端"
edition = "2021"
rust-version = "1.77"

[lib]
name = "securedm_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

