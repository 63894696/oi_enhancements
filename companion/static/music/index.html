<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrisirAI 音乐</title>
  <link rel="stylesheet" href="/music-static/app.css">
</head>
<body>
  <!-- 顶部状态条 -->
  <header id="topbar">
    <div class="brand">🎵 PrisirAI 音乐</div>
    <div class="filter-row">
      <select id="tag-filter" title="按标签过滤">
        <option value="">全部分类</option>
      </select>
      <button id="respin-btn" title="重新洗牌当前歌单">🔄 换一批</button>
    </div>
    <div class="health" id="health-tag" title="LX Desktop 状态">
      <span class="dot" id="lx-dot">⚪</span> <span id="lx-text">探测中</span>
    </div>
  </header>

  <!-- 主区:左+中 2/3 歌单网格 + 右 1/3 歌词 -->
  <main id="main">
    <section id="song-grid-pane">
      <div class="grid-head">
        <span id="grid-count">加载中…</span>
        <span class="grid-hint">点任意一张卡片开始播放</span>
      </div>
      <div id="song-grid"></div>
    </section>

    <aside id="lyric-pane">
      <div class="lyric-head" id="lyric-toggle">
        <span id="lyric-title">歌词</span>
        <span id="lyric-mode-tag"></span>
        <span id="lyric-toggle-icon">▾</span>
      </div>
      <div class="lyric-body" id="lyric-body">
        <div class="empty">(选择歌曲后自动加载歌词)</div>
      </div>
      <div class="track-actions" id="track-actions">
        <button id="favorite-btn" disabled title="收藏当前歌曲到本地库">♥ 收藏</button>
        <button id="download-btn" disabled title="下载当前歌曲到本地">↓ 下载</button>
      </div>
    </aside>

    <!-- 右下方:控制条(永远可见) -->
    <footer id="control-bar">
      <button id="prev-btn" title="上一首">⏮</button>
      <button id="play-btn" title="播放/暂停">▶</button>
      <button id="next-btn" title="下一首">⏭</button>
      <span id="now-title" class="now-title">未播放</span>
      <span class="progress-wrap">
        <span id="progress-time">0:00</span>
        <progress id="progress" value="0" max="100"></progress>
        <span id="progress-duration">0:00</span>
      </span>
    </footer>
  </main>

  <audio id="audio" preload="auto"></audio>
  <script src="/music-static/app.js"></script>
</body>
</html>
