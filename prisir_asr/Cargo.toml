[package]
name = "prisir_asr"
version = "0.1.0"
edition = "2021"
description = "Prisir Browser 内置 ASR 引擎 — SenseVoice Small 本地推理 (Rust + ort)"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ort = { version = "2.0.0-rc.13", features = ["load-dynamic"] }
ndarray = "0.17"
rustfft = "6"
hound = "3.5"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
